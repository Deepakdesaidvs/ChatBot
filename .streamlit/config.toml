[server]
# Local default; Render's start command overrides the address and port.
address = "127.0.0.1"
port = 8501
maxUploadSize = 50
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F4F8"
textColor = "#1F2937"
font = "sans serif"